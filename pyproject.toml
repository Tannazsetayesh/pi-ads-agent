[project]
name = "pi-ads-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tannaz Setayesh", email = "tanaz.setayesh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
]

[project.scripts]
pi-ads-agent = "pi_ads_agent:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
